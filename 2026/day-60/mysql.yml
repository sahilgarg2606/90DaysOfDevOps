kind: StatefulSet
apiVersion: apps/v1
metadata: 
    name: mysql
    namespace: capstone
    labels:
        app: mysql
spec:
   serviceName: "mysql-svc"
   replicas: 2
   selector:
      matchLabels:
          app: mysql
   template:
       metadata:
          labels:
              app: mysql
       spec:
          containers:
           - name: mysql
             image: mysql:8.0
             ports:
             - containerPort: 3306
             volumeMounts:
             - name: mysql-storage
               mountPath: /var/lib/mysql
             envFrom:
               - secretRef:
                   name: secrets
             resources:
                 requests:
                     memory: "512Mi"
                     cpu: "250m"
                 limits:
                      memory: "1Gi"
                      cpu: "500m"
   volumeClaimTemplates:
      - metadata:
            name: mysql-storage
        spec:
            accessModes: ["ReadWriteOnce"]
            resources:
                requests:
                    storage: 500Mi


