 tasks file for roles/nginx

    - name: install nginx
      apt:
        name: nginx
        state: present
        update_cache: true
      tags: nginx
    - name: Remove default Nginx config
      file:
        path: /etc/nginx/sites-available/default
        state: absent
      notify: Reload Nginx
      tags: nginx
    - name: Deploy main Nginx config
      template:
        src: nginx.conf.j2
        dest: /etc/nginx/nginx.conf
        owner: root
        group: root
        mode: '0644'
      notify: Reload Nginx
      tags: nginx

    - name: Deploy reverse proxy config
      template:
        src: app-proxy.conf.j2
        dest: /etc/nginx/sites-available/app-proxy.conf
        owner: root
        group: root
        mode: '0644'
      notify: Reload Nginx
      tags: nginx

    - name: Enable reverse proxy site
      file:
        src: /etc/nginx/sites-available/app-proxy.conf
        dest: /etc/nginx/sites-enabled/app-proxy.conf
        state: link
      notify: Reload Nginx
      tags: nginx

    - name: Test nginx configuration
      command: nginx -t
      become: true
      changed_when: false
      tags: nginx

    - name: Start and enable nginx
      service:
        name: nginx
        state: started
        enabled: true
      tags: nginx
